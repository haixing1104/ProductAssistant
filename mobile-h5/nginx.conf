# =============================================================================
# ProductAssistant | mobile-h5/nginx.conf
# 用途 : 移动端 H5 镜像内的静态托管配置（构建期 COPY 到 /etc/nginx/conf.d/default.conf）
# 说明 :
#   · 与 frontend/nginx.conf **同构**，差异只有一条注释口径：本镜像在边缘侧挂载于
#     **/m/** 路径。边缘 nginx 用 `proxy_pass http://pa-mobile-h5/;`（末尾斜杠）把
#     /m/ 前缀**剥离**后再转发，因此这里看到的请求路径已经是 /assets/...、/products/...，
#     与 vite 的 `base: "/m/"` 打出来的产物结构一致 —— 浏览器 URL 仍是 /m/products/x，
#     React Router 的 `basename="/m"` 负责把它还原成路由。
#   · **SPA 回退必须在本层**：否则刷新 /m/products/<id> 会 404（边缘只管剥离前缀）。
#   · index.html 必须 no-cache：发版后旧壳引用新不存在的 assets 会直接白屏。
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /__healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
