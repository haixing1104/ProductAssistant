<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让内容延伸到刘海/圆角区域，配合 antd-mobile 的 SafeArea 用；
         user-scalable=no：B 端工具页防误触缩放（输入框仍有 16px 字号避免 iOS 自动放大） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1677ff" />
    <meta name="format-detection" content="telephone=no" />
    <title>ProductAssistant · 移动审批</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
