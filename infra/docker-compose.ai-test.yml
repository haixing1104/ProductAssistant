# =============================================================================
# ProductAssistant | infra/docker-compose.ai-test.yml
# 用途    : ai-engine 集成测试编排 —— 一次性 PostgreSQL + Redis + pytest 容器
#           宿主机只需 Docker（无需安装 Python / PostgreSQL / Redis）
# 使用    : docker compose -f infra/docker-compose.ai-test.yml up --build \
#             --abort-on-container-exit --exit-code-from ai-tests
#           docker compose -f infra/docker-compose.ai-test.yml down -v
# 说明    :
#   · pgsql-test：官方 postgres:17 临时库，**不挂任何数据卷**；
#     测试数据由 ai-engine/tests/conftest.py 在用例内造、用例后清；
#   · redis     ：worker 端到端用例使用（job:generate / evt:* / result:workflow），
#     键前缀 PA_ENV=test + DB 15 与本地 dev 环境隔离；
#   · ai-tests  ：装 ai-engine 全量依赖跑 pytest；源码以挂载方式注入，改测试无需重建镜像；
#   · 三个容器都不持久化，down -v 后整体销毁 —— 宿主机 productassistant 库全程不被触碰；
#   · 真实 function calling 冒烟默认跳过：需 PA_TEST_LLM=1 且提供 ZHIPU_API_KEY。
# =============================================================================

name: productassistant-ai-test

services:
  # 一次性 PostgreSQL（临时库；测试期间存活，down -v 即销毁）
  pgsql-test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productassistant_test
    ports:
      # 供宿主机直连做快速迭代（可选）：DSN 指向 127.0.0.1:55432（仍不是宿主库）
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productassistant_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 一次性 Redis（worker 端到端用例；不开启 AOF，数据随容器销毁）
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # 测试执行容器（Python + ai-engine 依赖 + pytest）
  ai-tests:
    build:
      # 构建上下文=仓库根；Dockerfile 位于 ai-engine/tests 下
      context: ..
      dockerfile: ai-engine/tests/Dockerfile
    depends_on:
      pgsql-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 环境标识参与 Redis 键前缀 pa:{env}:...（与本地 dev 隔离）
      PA_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productassistant_test
      # 4 个应用角色密码（0001_schema.sql 的 :'admin_pwd' 等，由 conftest 注入）
      ROLE_PA_ADMIN_PWD: pa_admin_pwd123
      ROLE_PA_BACKEND_PWD: pa_backend_pwd123
      ROLE_PA_AI_PWD: pa_ai_pwd123
      ROLE_PA_AI_SETUP_PWD: pa_ai_setup_pwd123
      # 三类 DSN：超级用户灌 schema / role_pa_ai 取数 / role_pa_backend 造业务数据
      PA_TEST_SUPERUSER_DSN: postgresql://postgres:postgres@pgsql-test:5432/productassistant_test
      PA_TEST_PG_DSN: postgresql://role_pa_ai:pa_ai_pwd123@pgsql-test:5432/productassistant_test
      PA_TEST_PG_SETUP_PG_DSN: postgresql://role_pa_ai_setup:pa_ai_setup_pwd123@pgsql-test:5432/productassistant_test
      PA_TEST_BACKEND_PG_DSN: postgresql://role_pa_backend:pa_backend_pwd123@pgsql-test:5432/productassistant_test
      PA_TEST_REDIS_URL: redis://redis:6379/15
      # 真实 function calling 冒烟（默认关）：PA_TEST_LLM=1 且给 ZHIPU_API_KEY 才跑
      PA_TEST_LLM: "${PA_TEST_LLM:-0}"
      ZHIPU_API_KEY: "${ZHIPU_API_KEY:-}"
      ZHIPU_BASE_URL: "${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}"
      ZHIPU_GENERATE_MODEL: "${ZHIPU_GENERATE_MODEL:-glm-4-flash}"
    # 挂载源码：改 SQL/测试后无需重建镜像
    volumes:
      - ../ai-engine:/work/ai-engine
      - ../database:/work/database
    # pytest 配置见 ai-engine/pyproject.toml（pythonpath=["."] / testpaths=["tests"]）
    working_dir: /work/ai-engine
    command: ["pytest", "-q", "tests"]
    restart: "no"
