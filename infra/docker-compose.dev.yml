# =============================================================================
# ProductAssistant | infra/docker-compose.dev.yml
# 用途    : 本地开发基础设施编排（P1）：PostgreSQL + Redis 默认启动；Milvus 组按需启用
# 使用    : docker compose --env-file infra/.env.dev -f infra/docker-compose.dev.yml up/down -d
#           docker compose --env-file infra/.env.dev -f infra/docker-compose.dev.yml --profile ai up/down -d   # 连带 Milvus
# 说明    :
#   · PostgreSQL 首次启动（数据卷为空）时，
#         docker-entrypoint-initdb.d 会自动按文件名顺序执行
#         database/sql/*.sql
#           （0001 schema → 0002 grants → 0003 seed 
#            → 0004 审计 → 0005 约束对齐 → 0006 审批内容快照）；
#     PgSQL数据卷非空则不会重放；
#   · 重建库请用 infra/scripts/dev-db.sh reset。
#
#   postgres 17.x / redis 7.4.x / Milvus v2.6.x
# =============================================================================
services:
  # -- 配置pgsql docker 镜像服务 ---
  postgres:
    image: postgres:17
    container_name: pa-dev-postgres
    # 设置事务超时时间 idle_in_transaction_session_timeout 为 60s，避免长事务占用连接池
    # 行锁被无限期持有并拖垮整条 outbox 队列；DB 层加“空闲事务熔断”，超 60s 自动断开
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    # 定义容器内的环境变量
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pa_postgres_dev}
      POSTGRES_DB: ${POSTGRES_DB:-productassistant}
    ports:
    # 宿主端口可配（POSTGRES_PORT），容器内恒 5432：本地已有 PG 时改宿主端口规避冲突. 映射宿主端口到容器
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 使用名为 pgdata 的命名卷，挂载到容器内的 PostgreSQL 数据目录。
      - pgdata:/var/lib/postgresql/data
      # 把宿主机当前目录下的 ../database/sql 目录，以只读（ro-readonly）方式挂载到容器内的 /docker-entrypoint-initdb.d
      - ../database/sql:/docker-entrypoint-initdb.d:ro 
    # 定义容器健康检查
    healthcheck:
      # 健康检查命令 -U指定用户 -d指定数据库, 每5秒检查一次，间隔3秒，连续失败20次后，容器状态变为unhealthy
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-productassistant}"]
      interval: 5s
      timeout: 3s
      retries: 20


  # -- 配置redis docker 镜像服务 ---
  redis:
    image: redis:7.4-alpine
    container_name: pa-dev-redis
    # 启动 Redis 时开启 AOF 持久化。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 宿主端口可配（REDIS_PORT），容器内恒 6379. 映射宿主端口到容器
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # 持久化必须挂载 /data，把持久化目录映射到Dockers卷redisdata里
      - redisdata:/data
    # 定义容器健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- 配置Milvus 组 （商品文案向量库，RAG召回）：体积大，按需 --profile ai 启用 ---
  # Milvus（索引大脑曾）无法单独跑，必须依赖etcd（元数据协调层）和minio（数据落地层），
  # 且etcd和minio必须在Milvus之前启动
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: pa-dev-etcd
    # 该服务只在启用 ai 这个 profile 时才会启动。docker compose --profile ai up -d
    profiles: ["ai"]
    # 设置etcd的启动命令
    # 指定广告客户端URL为http://etcd:2379
    # 监听客户端URL为http://0.0.0.0:2379
    # 并将数据目录设置为/etcd-data
    # 配置自动压缩模式为revision，保留1000个修订版本，设置后端存储配额上限为4GB
    command: 
      - etcd 
      - --advertise-client-urls=http://etcd:2379 
      - --listen-client-urls=http://0.0.0.0:2379 
      - --data-dir=/etcd-data      
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
    volumes:
      - etcddata:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: pa-dev-minio
    # 该服务只在启用 ai 这个 profile 时才会启动。docker compose --profile ai up -d
    profiles: ["ai"]
    # 设置minio的环境变量，配置根用户和密码
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      # 映射宿主端口到容器，9000是MinIO的API访问端口，9001是MinIO的Web浏览器控制台端口
      - "9000:9000" 
      - "9001:9001"
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.6.1
    container_name: pa-dev-milvus
    # 该服务只在启用 ai 这个 profile 时才会启动。docker compose --profile ai up -d
    profiles: ["ai"]
    # 设置milvus的启动命令，运行milvus的独立模式
    command: ["milvus", "run", "standalone"]
    # 设置milvus的环境变量，配置etcd和minio的地址和端口，设置milvus的监听端口为19530，设置milvus的数据目录为/milvus_data
    environment:
      ETCD_ENDPOINTS: "etcd:2379"
      MINIO_ADDRESS: "minio:9000"
    ports:
      # 映射宿主端口到容器，19530是Milvus的gRPC访问端口，9091是Milvus的HTTP访问端口
      - "19530:19530" 
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# 命名卷，用于持久化
volumes:
  pgdata:
  redisdata:
  etcddata:
  miniodata:
  milvusdata: