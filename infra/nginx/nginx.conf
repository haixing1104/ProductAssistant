# =============================================================================
# ProductAssistant | infra/nginx/nginx.conf
# 用途 : 边缘 nginx 主配置（挂载进 nginx:1.27-alpine 的 /etc/nginx/nginx.conf）
# 角色 : 本文件只定义"进程级"行为；站点路由全部在 conf.d/pa.conf
# 说明 :
#   · 用自定义主配置而不是复用镜像默认：默认 conf.d/default.conf 会占掉 80 端口
#     的默认站点，与本文件挂载的 pa.conf 冲突（两个 server 抢同一个 listen）。
#   · 这里放 **http 级公共 proxy_set_header**：默认会被所有 location 继承；
#     但只要某个 location 自己写了任意一条 proxy_set_header，本层全部失效 →
#     conf.d/pa.conf 的 /api/ 段必须显式重复这几行（原因写在那里）。
#   · client_max_body_size 20m：CSV 导入是唯一经本层上传的请求；
#     商品图不走这里（浏览器用 OSS 预签名直传，字节流不经过 nginx）。
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 带 upstream 耗时：排障时能一眼区分"nginx 慢"还是"后端慢"
    log_format pa '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';
    access_log /var/log/nginx/access.log pa;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # 不回显版本号（对外少暴露一条指纹信息）
    server_tokens off;

    client_max_body_size 20m;

    # 静态资源压缩（vite 产物 JS/CSS 文本占比高，收益明显）；
    # 动图（gif）本来已压缩，不列入 gzip_types，避免白费 CPU
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript image/svg+xml application/xml;

    # --- 反向代理公共头（http 级默认继承；见文件头说明的例外）---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
