# =============================================================================
# ProductAssistant | infra/nginx/conf.d/pa.conf
# 用途 : 边缘反向代理站点配置 —— TLS 终结 + 路径分流 + /api 反代（唯一对外入口）
# 域名 : seektruth.org.cn（PA_DOMAIN；证书文件由 compose 挂载到 /etc/nginx/certs）
#
# 路由表（这是本项目生产形态的"单一事实源"，改这里等于改对外契约）:
#   https://<域名>/                   → pa-frontend:80      （PC 工作台；**前缀不剥离**，挂在根）
#   https://<域名>/m/                 → pa-mobile-h5:80     （移动端 H5；**剥离 /m/**）
#   https://<域名>/welcome/           → pa-portfolio:80     （作品集宣传页；**剥离 /welcome/**）
#   https://<域名>/api/v1/…           → pa-backend:8000     （后端 API；**前缀不剥离**，路由自带 /api/v1）
#   https://<域名>/healthz | /readyz  → pa-backend:8000     （探针：存活 / 就绪，部署验收直接用）
#
# 为什么必须"剥离前缀"（三处最容易配错的地方之一）:
#   vite 的 `base: "/m/"` 会把产物引用打成 /m/assets/index-xxx.js，因此浏览器的请求**带 /m/**；
#   而静态容器里的文件在 /assets/index-xxx.js。用 `proxy_pass http://pa-mobile-h5/;`
#   （**末尾斜杠**）让 nginx 去掉 /m/ 前缀再转发，两边才对齐。
#   浏览器地址栏保持不变 → React Router 的 `basename="/m"` 才能把 /m/products/x 还原成 /products/x。
#   ⚠️ base 与 basename 必须**同时**存在：只改一处 = 白屏或资源 404（见 docs/deploy.md §10）。
#
# 为什么 80 端口这台 server 不能直接全量 301: 
#   certbot 走 HTTP-01 时要在**明文 80** 上取走 /.well-known/acme-challenge/<token>，
#   若被 301 到 https（而证书尚未签发）续期/首签都会失败 → 该 location 必须排在最前。
# =============================================================================

# --- HTTP：ACME 挑战 + 边缘存活探针 + 其余全量跳 HTTPS ---
server {
    listen 80;
    server_name _;

    # certbot --webroot 的落点（compose 把 ./nginx/www 挂到 /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 边缘自身探针：只证明"nginx 活着"，不依赖任何后端（compose healthcheck 用）
    location = /__edge_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS：业务入口 ---
server {
    listen 443 ssl;
    http2 on;                     # nginx ≥1.25.1 的新语法（镜像为 1.27）
    server_name _;

    # 证书：首次由 prod-bootstrap.sh 生成自签（保证栈能起来），随后 certbot 覆盖同名文件并 reload
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头：本项目是同源 SPA + HttpOnly refresh cookie，这几条足够且不会互相打架
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- 探针：直通后端，部署验收时用 curl -f 判成败 ---------------------------
    # /healthz = 进程活着（不查依赖，用于存活）；/readyz = PG+Redis 都通（用于就绪）。
    # 两者语义不同，别混用：把 /healthz 当就绪探针会让"PG 抖动"被误判为"服务正常"。
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://pa-backend:8000;
        access_log off;
    }

    # --- 后端 API（含 SSE 长连接：打字机的生死线）-----------------------------
    # ⚠️ 以下 proxy_set_header 必须**显式重复**（http 级的公共头在这里不继承：
    #    location 内一旦出现任意一条 proxy_set_header，http 级的那组就整体失效）。
    # 四行 SSE 关键配置，**缺一即坏**：
    #   proxy_buffering off         —— 代理攒数据会把"逐字出现"变成"一次性出现"（实测症状）
    #   proxy_http_version 1.1      —— 长连接必须 1.1
    #   proxy_set_header Connection ""  —— 清掉 hop-by-hop 头，否则上游按短连接处理
    #   proxy_read_timeout 3600s    —— 空闲关流由后端自己控制（BACKEND_STREAM_IDLE_SECONDS=120），
    #                                  nginx 不能抢先掐断，否则前端把正常空闲误判为"读流异常"
    location /api/ {
        proxy_pass http://pa-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- 移动端 H5：/m/ → pa-mobile-h5（末尾斜杠 = 剥离 /m/）-------------------
    location = /m { return 301 /m/; }          # 少一个斜杠时补上，否则 SPA 相对资源会错位
    location /m/ {
        proxy_pass http://pa-mobile-h5/;
    }

    # --- 作品集宣传页：/welcome/ → pa-portfolio（末尾斜杠 = 剥离 /welcome/）----
    location = /welcome { return 301 /welcome/; }
    location /welcome/ {
        proxy_pass http://pa-portfolio/;
    }

    # --- PC 工作台：挂在根，路径**不剥离**（vite base = "/"，路由直接用 /products/x）---
    location / {
        proxy_pass http://pa-frontend;
    }
}
