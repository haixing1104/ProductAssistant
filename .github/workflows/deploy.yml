# =============================================================================
# ProductAssistant | .github/workflows/deploy.yml
# 用途 : 构建镜像 → 推阿里云 ACR → SSH 部署到 ECS（47.116.53.86 / 华东2 上海）
# 触发 : workflow_dispatch（手动，三种 mode，推荐）；push tag v*（打版本号即自动发布）
# 需要 : Secrets（6 个）—— SSH_HOST / SSH_USER / SSH_PORT / SSH_PRIVATE_KEY
#                           ACR_USERNAME / ACR_PASSWORD
#        ⚠️ ACR **地址本身不是密钥**（推/拉都要凭据，地址公开）→ 写成下面 env 里的三个常量。
#          **不要**从 secrets 派生地址再当 job outputs 传给下游 job：GitHub 会丢弃
#          "值里含 secret 的输出"（日志只留一行 `Skip output 'ci_host' since it may contain
#          secret.`），下游拿到的就是**空字符串** → `docker login` 没有目标 registry，
#          回落到 Docker Hub 并用 ACR 凭据登录 → 报
#          `Get "https://registry-1.docker.io/v2/": unauthorized: incorrect username or password`。
#          （2026-09-20 实测踩坑；排障见 infra/docs/deploy.md §10 #16）
# 三种模式（手动触发时选）:
#   ping      只验证"密钥接线 + 服务器现状"（whoami/软件/目录/证书），**不改服务器任何东西**
#   bootstrap 一次性初始化：swap / Docker / PostgreSQL(+容器可达) / rsync / 目录与自签证书。
#             幂等可反复跑；实现在 infra/scripts/prod-bootstrap.sh（脚本入库便于审查与手工重跑）
#   deploy    发布：迁移 → 拉镜像 → 起栈 → 重载边缘 → 验收（infra/scripts/prod-deploy.sh）
# 为什么构建在 CI 而不在服务器 :
#   实测服务器 2 vCPU / 1608MB 内存 —— `vite build`（Node 常吃 1~2G）与 pip 安装会 OOM。
#   所以：CI 构建推 ACR，服务器**只 pull**。
# 为什么基础镜像也要转推 ACR（mirror-images job）:
#   实测服务器 `registry-1.docker.io` **直连超时**（`curl -m 8 https://registry-1.docker.io/v2/`
#   返回 000）—— compose 里直接引用的第三方镜像（redis、以及 edge 用的 nginx）必须先在
#   ACR 里有一份，否则 `docker compose pull` 必失败。注意：**即使宿主本地已有同名缓存也会
#   失败**（pull 一定会去问 registry），而 prod-deploy.sh 是 set -e，会卡死在 3/5 步。
# 为什么推送一律用裸 docker push（而不是 buildx --push）:
#   2026-09-20 实测：buildx 默认带 provenance 证明 → 推上去的是 **OCI 索引**（含一个
#   platform=unknown/unknown 的证明清单），ACR 个人版直接拒绝，报 `denied: unknown manifest`
#   （5 个应用镜像全挂；而同一 run 里用裸 docker push 转推的 redis/nginx 成功）。
#   所以：buildx 只负责**构建**（load 进本地 docker），推送统一交给 docker CLI。
# 完整步骤、验收与排障：infra/docs/deploy.md
# =============================================================================
name: 部署到阿里云 ECS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ping=验接线 / bootstrap=初始化服务器 / deploy=发布"
        type: choice
        options: [deploy, bootstrap, ping]
        default: deploy
  push:
    tags: ["v*"]

# 部署不能并发：两个 job 同时 up -d 会互相踩（后一个把前一个刚建的容器又重建）
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODE: ${{ inputs.mode || 'deploy' }}
  REMOTE_DIR: /srv/pa

  # --- ACR 地址（**非密钥**，见文件头 ⚠️）：改地址只改这三行 -------------------
  #   ACR_CI_HOST / ACR_CI_REGISTRY : CI 推送用 —— runner 在海外，必须走**公网**域名
  #   ACR_VPC_REGISTRY              : 服务器拉取用 —— 同地域走 **VPC** 域名，免公网流量费
  #     必须与服务器 /srv/pa/infra/.env 的 PA_IMAGE_REGISTRY **逐字符一致**；
  #     deploy job 会对一次（不一致只告警，实际以服务器上的 .env 为准）
  ACR_CI_HOST: crpi-7sj157u0r3y1jvd8.cn-shanghai.personal.cr.aliyuncs.com
  ACR_CI_REGISTRY: crpi-7sj157u0r3y1jvd8.cn-shanghai.personal.cr.aliyuncs.com/lihaixing-docker-image-rep/application_assistant
  ACR_VPC_REGISTRY: crpi-7sj157u0r3y1jvd8-vpc.cn-shanghai.personal.cr.aliyuncs.com/lihaixing-docker-image-rep/application_assistant

jobs:

  # ---------------------------------------------------------------------------
  # 构建并推送 5 个应用镜像（tag = <模块>-<git sha>）
  #   · mobile-h5 的构建上下文是**仓库根**（@pa/core → ../frontend/src，见其 Dockerfile 注释）
  #   · pip/npm 源显式覆盖为官方源：镜像默认走国内源（本地构建快），runner 在海外反而慢
  #   · cache-from/to: gha —— 二次构建只推变化的层（跨境推送是这条流水线的瓶颈）
  #   · 推**不用** buildx 的 --push：build-push-action 默认带 provenance 证明 → buildx 推的是
  #     OCI 索引（内含 platform=unknown/unknown 的证明清单），ACR 个人版会报
  #     `denied: unknown manifest`。改为 `load: true` + 裸 `docker push`（Docker v2 单清单）——
  #     与下面 mirror-images 的转推走同一条路径（那条路径 2026-09-20 实测是通的）。
  # ---------------------------------------------------------------------------
  build-push:
    name: 构建并推送 ${{ matrix.name }}
    if: ${{ github.event_name == 'push' || inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend,   context: backend-api, dockerfile: backend-api/Dockerfile }
          - { name: ai-engine, context: ai-engine,   dockerfile: ai-engine/Dockerfile }
          - { name: frontend,  context: frontend,    dockerfile: frontend/Dockerfile }
          - { name: mobile-h5, context: .,           dockerfile: mobile-h5/Dockerfile }
          - { name: portfolio, context: portfolio,   dockerfile: portfolio/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      # 校验地址 + 导出给下面的 `with:` 用。为什么要有这一步"导出"：
      #   · 值来自顶部的**非密钥常量** → 写进步骤输出不会有"含 secret 被丢弃"的风险
      #     （这正是原来的 prepare job 翻车的地方，见文件头 ⚠️）；
      #   · steps.*.outputs.* 是 `with:` 里确定可用的取值方式（env 上下文在 with/env
      #     这类位置支持面更窄，这里干脆不依赖它）。
      # 顺带做前缀校验：地址拼错时在这里就红，而不是等 docker login 报一堆网络错误。
      - id: acr
        name: 校验镜像地址并导出
        run: |
          set -euo pipefail
          case "${ACR_CI_REGISTRY}" in
            "${ACR_CI_HOST}"/*) ;;
            *) echo "::error::ACR_CI_REGISTRY（${ACR_CI_REGISTRY}）必须以 ACR_CI_HOST（${ACR_CI_HOST}）开头 —— 改 deploy.yml 顶部的三个常量"; exit 1 ;;
          esac
          { echo "ci_host=${ACR_CI_HOST}"; echo "ci_registry=${ACR_CI_REGISTRY}"; } >> "$GITHUB_OUTPUT"
          echo "推送地址（CI/公网）：${ACR_CI_REGISTRY}"
          echo "拉取地址（ECS/VPC）：${ACR_VPC_REGISTRY}"

      - uses: docker/setup-buildx-action@v3

      # 用裸 docker login 而不是 docker/login-action：全文件只有**一种**凭据处理模式
      # （与 mirror-images 一字不差），凭据经 stdin，不进命令行、不进日志。
      - name: 登录 ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_CI_HOST}"

      - name: 构建（只装进 runner 的 docker，不直接推）
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # ⚠️ 这里**不用** buildx 的 `push: true`（2026-09-20 实测：它在 ACR 个人版上必失败，
          #   报 `denied: unknown manifest`）。原因：build-push-action 默认带 provenance 证明，
          #   buildx 会因此把输出从「单清单」升级成 **OCI 索引**（索引里还有一个
          #   platform=unknown/unknown 的证明清单）——ACR 个人版不接受这种清单。
          #   同一个 run 里"转推基础镜像"用**裸 docker push** 是成功的 → 我们就统一走那条路径：
          #   先 `load` 进本地 docker，下一步再用 `docker push` 推（Docker v2 单清单）。
          load: true
          push: false
          provenance: false           # 关掉证明/SBOM（它们在 load 路径上本来就会被丢掉）
          sbom: false
          tags: ${{ steps.acr.outputs.ci_registry }}:${{ matrix.name }}-${{ github.sha }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_EXTRA_INDEX_URL=https://pypi.org/simple
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # 推送到 ACR —— 与 mirror-images 里"转推基础镜像"用的是**同一条路径**（裸 docker push）。
      # 为什么不用 buildx 的 --push：见上面那段注释（ACR 个人版对 OCI 索引/证明清单报
      # `denied: unknown manifest`）。裸 docker push 推的是 Docker v2 单清单，实测可行。
      - name: 推送到 ACR
        env:
          IMAGE: ${{ steps.acr.outputs.ci_registry }}:${{ matrix.name }}-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}"

  # ---------------------------------------------------------------------------
  # 第三方基础镜像转推 ACR（服务器连不上 Docker Hub，必须先在 ACR 里有一份）
  # 命名与 compose 里的引用**严格对应**（两处必须同时改，只改一处 = 部署时 pull 失败）：
  #   <registry>:redis-7.4-alpine  ← compose 的 pa-redis-prod
  #   <registry>:nginx-1.27-alpine ← compose 的 pa-edge
  # ---------------------------------------------------------------------------
  mirror-images:
    name: 转推基础镜像 ${{ matrix.name }}
    if: ${{ github.event_name == 'push' || inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 一个镜像失败不拖累另一个（能推的先推上去）
      matrix:
        include:
          - { name: redis, src: redis:7.4-alpine,  tag: redis-7.4-alpine }
          - { name: nginx, src: nginx:1.27-alpine, tag: nginx-1.27-alpine }
    steps:
      # 不需要 setup-buildx：这里只做"拉公网镜像 → 重打 tag → 推 ACR"，不构建
      - name: 拉公网镜像 → 重打 tag → 推 ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SRC: ${{ matrix.src }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_CI_HOST}"
          dst="${ACR_CI_REGISTRY}:${TAG}"
          echo "转推：${SRC}  →  ${dst}"
          docker pull "${SRC}"
          docker tag "${SRC}" "${dst}"
          docker push "${dst}"

  # ---------------------------------------------------------------------------
  # 部署：SSH 到 ECS（三种 mode 在同一个 job 内分支，避免多套 SSH 配置重复）
  #   用 ~/.ssh/pa_deploy 这个 ssh config 别名统一承载连接参数：
  #   后续 ssh / rsync 都只写 `pa-deploy`，参数不会散落在十几处命令里。
  # ---------------------------------------------------------------------------
  deploy:
    name: 部署（mode=${{ inputs.mode || 'deploy' }}）
    needs: [build-push, mirror-images]
    # ping/bootstrap 模式下 build-push 与 mirror-images 会被**跳过**（result=skipped），
    # 所以这里用 "!= failure" 表达"只要构建没失败就继续"。
    if: ${{ !cancelled() && needs.build-push.result != 'failure' && needs.mirror-images.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      IMAGE_TAG: ${{ github.sha }}
      # 这里不再派生 VPC 地址：工作流顶部的 ACR_VPC_REGISTRY 在每个 run 步骤里就是环境变量，
      # 对齐检查直接用 ${ACR_VPC_REGISTRY}（少一层 needs.outputs，就少一类"静默为空"的坑）
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH（私钥 + 连接别名）并做连通性自检
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 私钥经 printf 落盘（不 echo，避免特殊字符被解释）；权限必须 600，否则 ssh 直接拒绝
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/pa_deploy <<EOF
          Host pa-deploy
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/pa_deploy
          echo "== 连通性自检 =="
          ssh -F ~/.ssh/pa_deploy pa-deploy 'whoami; hostname'

      # rsync 只同步"编排与迁移"这两块，**不同步整个仓库**：
      #   · 服务器不需要应用源码（源码在镜像里）；
      #   · 服务器也不需要 git（实测国内拉 github.com 不稳定），部署完全由 CI 推送驱动；
      #   · --exclude 同时保护服务器侧文件不被 --delete 删掉（.env / 备份 / 证书 / ACME 目录）。
      - name: 同步编排文件（infra/ 与 database/；ping 模式跳过）
        if: env.MODE != 'ping'
        run: |
          set -euo pipefail
          RSYNC_SSH="ssh -F ${HOME}/.ssh/pa_deploy"
          EXCLUDES=(--exclude='.env' --exclude='backups/' --exclude='nginx/certs/' --exclude='nginx/www/')
          rsync -az --delete "${EXCLUDES[@]}" -e "${RSYNC_SSH}" infra/ "pa-deploy:${REMOTE_DIR}/infra/"
          rsync -az --delete -e "${RSYNC_SSH}" database/ "pa-deploy:${REMOTE_DIR}/database/"
          echo "== 已同步（服务器侧受保护项：infra/.env、infra/backups、infra/nginx/certs、infra/nginx/www）=="

      # --- 模式一：ping —— 只读验证"密钥接线 + 服务器现状"（首次接入时先点这个）---
      # 刻意**不做任何写操作**：连 rsync 都跳过。用来回答三个问题：
      #   ① 私钥/用户名/端口对不对？ ② Docker 装了吗？ ③ 部署目录与证书到位了吗？
      - name: ping（只读自检）
        if: env.MODE == 'ping'
        run: |
          ssh -F ~/.ssh/pa_deploy pa-deploy 'bash -s' <<'REMOTE'
          echo "== 身份 =="; whoami; hostname; id -u
          echo; echo "== 系统 =="; . /etc/os-release && echo "$PRETTY_NAME"; nproc
          free -m | head -2; df -h / | tail -1
          echo; echo "== swap =="; swapon --show 2>/dev/null || echo NO_SWAP
          echo; echo "== 软件 =="
          docker --version 2>/dev/null || echo NO_DOCKER
          docker compose version --short 2>/dev/null || echo NO_COMPOSE
          psql --version 2>/dev/null || echo NO_PSQL
          rsync --version 2>/dev/null | head -1 || echo NO_RSYNC
          echo; echo "== 部署目录 =="
          ls -la /srv/pa 2>/dev/null || echo NO_DEPLOY_DIR
          echo; echo "== 关键文件 =="
          [ -f /srv/pa/infra/.env ] && echo "infra/.env    : 已存在" || echo "infra/.env    : 缺失（见 docs §4）"
          [ -f /srv/pa/infra/nginx/certs/fullchain.pem ] && echo "证书          : 已存在" || echo "证书          : 缺失（mode=bootstrap 会补自签兜底）"
          echo; echo "== 容器 =="
          docker ps --format '{{.Names}}\t{{.Status}}' 2>/dev/null || true
          REMOTE

      # --- 模式二：bootstrap —— 系统层一次性初始化（幂等，可反复跑）---
      - name: bootstrap（安装 swap/Docker/PostgreSQL 并生成自签证书兜底）
        if: env.MODE == 'bootstrap'
        run: |
          ssh -F ~/.ssh/pa_deploy pa-deploy "cd ${REMOTE_DIR} && ./infra/scripts/prod-bootstrap.sh"

      # --- 模式三：deploy —— 发布（迁移 → 拉镜像 → 起栈 → 重载边缘 → 验收）---
      - name: 部署（tag=${{ github.sha }}）
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          # ① 凭据经 **stdin** 写入服务器临时文件（不进命令行 → 不进 ps / 不进 CI 日志），
          #    prod-deploy.sh 读完立即删除；权限 600 由远端 umask 保证。
          printf 'ACR_USERNAME=%s\nACR_PASSWORD=%s\n' "${ACR_USERNAME}" "${ACR_PASSWORD}" \
            | ssh -F ~/.ssh/pa_deploy pa-deploy "umask 077; cat > ${REMOTE_DIR}/.acr-creds"
          # ② 对齐检查（不阻断）：工作流顶部的 ACR_VPC_REGISTRY 应与服务器 infra/.env 里的一致
          #   注意末尾的 `|| true`：这条只是"信息提示"（下一行用 || echo ::warning:: 表达不一致），
          #   但在 set -euo pipefail 下，只要 .env 缺失/不可读，grep 非 0 就会**在部署脚本跑之前**
          #   中止整步 —— 2026-09-20 实测：这一层会把真正的失败原因掩盖掉，排障成本很高。
          remote_registry="$(ssh -F ~/.ssh/pa_deploy pa-deploy "grep -E '^PA_IMAGE_REGISTRY=' ${REMOTE_DIR}/infra/.env | cut -d= -f2-" || true)"
          echo "服务器 infra/.env ：${remote_registry}"
          echo "CI 常量（VPC）    ：${ACR_VPC_REGISTRY}"
          [ "${remote_registry}" = "${ACR_VPC_REGISTRY}" ] || echo "::warning::两者不一致 —— 服务器会用 infra/.env 里的地址拉镜像（若拉取失败请核对 docs §10）"
          # ③ 发布（脚本内含：迁移 → pull → up → edge reload → prod-verify 验收）
          ssh -F ~/.ssh/pa_deploy pa-deploy "cd ${REMOTE_DIR} && ./infra/scripts/prod-deploy.sh '${IMAGE_TAG}'"

      # 把结果写进 Actions 摘要页：部署完一眼能看到版本号与回滚命令
      - name: 部署摘要
        if: always() && env.MODE != 'ping'
        run: |
          {
            echo "### ProductAssistant 部署（mode=${MODE}）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像 tag | \`${IMAGE_TAG}\` |"
            echo "| 目标主机 | \`${SSH_HOST}\` |"
            echo "| 结果 | ${{ job.status }} |"
            echo ""
            echo "回滚（在服务器上）：\`/srv/pa/infra/scripts/prod-deploy.sh --rollback\`"
            echo ""
            echo "验收：\`/srv/pa/infra/scripts/prod-verify.sh\`　·　排障：\`infra/docs/deploy.md §10\`"
          } >> "$GITHUB_STEP_SUMMARY"



