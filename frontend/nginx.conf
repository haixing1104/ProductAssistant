# =============================================================================
# ProductAssistant | frontend/nginx.conf
# 用途 : PC 工作台镜像内的静态托管配置（构建期 COPY 到 /etc/nginx/conf.d/default.conf）
# 说明 :
#   · **SPA 回退必须在本层**：边缘 nginx（infra/nginx）只做前缀剥离与 /api 反代，
#     不接触静态文件；刷新 /products/<id>、/approvals/<id> 这类深链由这里的
#     try_files 回退到 /index.html，否则浏览器直接 404（BrowserRouter 足够，无需 hash 路由）。
#   · assets/* 带内容哈希 → 可长缓存；index.html **必须 no-cache**，
#     否则发版后用户仍拿到旧壳、引用的旧 assets 已被新镜像覆盖 → 白屏。
#   · /__healthz 供 compose healthcheck 探活（不要拿 / 当探针：SPA 首页体积大且无语义）。
# 边界 : 本文件不含 /api 反代（模块红线：反代属边缘层）；也不含 TLS（由边缘 nginx 终结）。
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 探针：纯文本 200，不读磁盘
    location = /__healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 带内容哈希的构建产物：一年长缓存 + immutable（发版换文件名，不会读到旧内容）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML：绝不缓存（no-cache 仍允许 304 校验，比 no-store 省流量）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 其余路径一律回退 SPA 入口（深链刷新、直接粘贴 URL 都靠这一条）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
