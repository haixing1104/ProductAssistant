# =============================================================================
# ProductAssistant | portfolio/nginx.conf
# 用途 : 作品集宣传页镜像内的静态托管配置（构建期 COPY 到 /etc/nginx/conf.d/default.conf）
# 说明 :
#   · 本模块**零后端依赖**（没有 /api 代理、不连任何服务）→ 这里是最纯粹的静态托管，
#     与 frontend/mobile-h5 的差异只有：没有 /api，也不需要 SPA 深链回退的强需求
#     （当前只有一个作品 + 锚点），但**仍保留 try_files 回退**，将来加 /p/:slug 路由不必改基建。
#   · 演示动图在 /demos/pa/**（约 19MB，gifsicle 优化过）：必须给长缓存 —— 否则每次
#     端/段切换都会重新下载整段动图（页面观感直接退化）。
#   · 边缘侧挂载于 **/welcome/** 路径（`proxy_pass http://pa-portfolio/;` 剥离前缀），
#     与 vite 的 `base: "/welcome/"` 对齐。
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /__healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 构建产物 + 演示动图：长缓存（文件名带哈希或本身就是不复变的内容）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /demos/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
